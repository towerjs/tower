services:
  postgres:
    image: postgres:17-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: tower
      POSTGRES_USER: tower
      POSTGRES_PASSWORD: tower
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tower']
      interval: 1s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
