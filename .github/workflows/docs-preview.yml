name: Docs Preview

on:
  pull_request:
    paths:
      - 'docs/**'
    types: [opened, synchronize, reopened]

concurrency:
  group: docs-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tower-docs
        uses: actions/checkout@v7
        with:
          repository: hyphenzero/tower-docs
          token: ${{ secrets.DOCS_SYNC_PAT }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Debug secret shapes
        run: |
          echo "token len=${#VERCEL_TOKEN} org len=${#VERCEL_ORG_ID} project len=${#VERCEL_PROJECT_ID}"
          echo "org prefix=${VERCEL_ORG_ID:0:5} project prefix=${VERCEL_PROJECT_ID:0:4}"

      - name: Deploy preview to Vercel
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DOCS_SOURCE_URL: https://github.com/towerjs/tower/archive/${{ github.event.pull_request.head.sha }}.tar.gz
          DOCS_SOURCE_TOKEN: ${{ secrets.DOCS_SYNC_PAT }}
        run: |
          cd "$GITHUB_WORKSPACE"
          set +e
          VERCEL_DEPLOY_OUTPUT=$(npx vercel deploy --yes \
            -e DOCS_SOURCE_URL="${DOCS_SOURCE_URL}" \
            -e DOCS_SOURCE_TOKEN="${DOCS_SOURCE_TOKEN}" \
            --token="${VERCEL_TOKEN}" \
            --project="${VERCEL_PROJECT_ID}" \
            --scope="${VERCEL_ORG_ID}" \
            2>&1)
          VERCEL_EXIT_CODE=$?
          echo "VERCEL_DEPLOY_OUTPUT<<EOF" >> "$GITHUB_OUTPUT"
          echo "$VERCEL_DEPLOY_OUTPUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "$VERCEL_DEPLOY_OUTPUT"
          exit "$VERCEL_EXIT_CODE"

      - name: Extract preview URL
        id: extract-url
        run: |
          DEPLOY_OUTPUT="${{ steps.vercel.outputs.VERCEL_DEPLOY_OUTPUT }}"
          # Vercel CLI outputs the preview URL as the last line containing "https://" and the project domain
          PREVIEW_URL=$(echo "$DEPLOY_OUTPUT" | grep -E '^https://[^ ]+\.vercel\.app' | tail -1)
          if [ -z "$PREVIEW_URL" ]; then
            # Fallback: try to extract from the output
            PREVIEW_URL=$(echo "$DEPLOY_OUTPUT" | grep -oE 'https://[^ ]+\.vercel\.app' | tail -1)
          fi
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $PREVIEW_URL"

      - name: Comment on PR
        if: steps.extract-url.outputs.PREVIEW_URL != ''
        uses: actions/github-script@v7
        with:
          script: |
            const { PREVIEW_URL, PR_NUMBER } = process.env
            const { owner, repo } = context.repo

            // Delete any existing preview comments from this bot
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number: PR_NUMBER })
            for (const comment of comments.data) {
              if (comment.body.includes('Docs preview deployment:') && comment.user.type === 'Bot') {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: comment.id })
              }
            }

            // Post new comment with updated URL
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: PR_NUMBER,
              body: `Docs preview deployment: ${PREVIEW_URL}`
            })
        env:
          PREVIEW_URL: ${{ steps.extract-url.outputs.PREVIEW_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
