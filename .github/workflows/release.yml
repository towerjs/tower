name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force-publish:
        description: >-
          Publish the current main branch to npm even when the last event was
          not a release PR merge. Used for the initial release or to retry a
          failed publish.
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm check:versions

      # The authoritative release signal is PR metadata, not the commit title:
      # a merged PR whose head branch is exactly release/vX.Y.Z with title
      # vX.Y.Z. Every convention must hold or nothing is published.
      - name: Determine whether this is a release
        id: release
        env:
          FORCE_PUBLISH: ${{ github.event.inputs.force-publish || 'false' }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_FROM_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          publish="false"
          version=""
          reason=""
          if [ "$FORCE_PUBLISH" = "true" ]; then
            publish="true"
            version="$(node -e "console.log(require('./packages/tower/package.json').version)")"
            reason="force-publish requested"
          elif [ "$PR_MERGED" != "true" ]; then
            reason="PR was closed without merging"
          elif [ "$PR_FROM_FORK" = "true" ]; then
            reason="PR originates from a fork"
          elif [[ ! "$HEAD_REF" =~ ^release/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            reason="head branch \"${HEAD_REF:-<none>}\" is not release/vX.Y.Z"
          elif [ "$PR_TITLE" != "v${BASH_REMATCH[1]}" ]; then
            reason="PR title \"$PR_TITLE\" does not match v${BASH_REMATCH[1]}"
          else
            publish="true"
            version="${BASH_REMATCH[1]}"
            reason="release/v${version} merged as v${version} (#$PR_NUMBER)"
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Release decision
        run: echo "${{ steps.release.outputs.reason }}"

      # The commit title is historical metadata, not the release trigger, but
      # it must be consistent with the PR convention (squash merge).
      - name: Verify commit title
        if: steps.release.outputs.publish == 'true'
        run: |
          expected="v${{ steps.release.outputs.version }} (#${{ github.event.pull_request.number }})"
          actual="$(git log -1 --pretty=%s)"
          if [ "$actual" != "$expected" ]; then
            echo "Merge commit title \"$actual\" does not match \"$expected\"" >&2
            exit 1
          fi

      - name: Verify version and changelog
        if: steps.release.outputs.publish == 'true'
        run: |
          version="$(node -e "console.log(require('./packages/tower/package.json').version)")"
          if [ "$version" != "${{ steps.release.outputs.version }}" ]; then
            echo "Release claims v${{ steps.release.outputs.version }} but packages are at $version" >&2
            exit 1
          fi
          if ! grep -q "^## \[$version\] - " CHANGELOG.md; then
            echo "CHANGELOG.md has no entry for $version" >&2
            exit 1
          fi

      - name: Build
        if: steps.release.outputs.publish == 'true'
        run: pnpm build

      - name: Publish to npm
        if: steps.release.outputs.publish == 'true'
        # Tokenless publishing via npm trusted publishing (OIDC): the workflow
        # declares id-token: write and each package has a trusted publisher for
        # this workflow file configured on npmjs.com. No NPM_TOKEN is stored.
        # Same-repo pull_request events receive the id-token; fork PRs do not.
        run: pnpm -r publish --no-git-checks

      - name: Tag and push v${{ steps.release.outputs.version }}
        if: steps.release.outputs.publish == 'true'
        run: |
          git tag "v${{ steps.release.outputs.version }}"
          git push origin "v${{ steps.release.outputs.version }}"

      - name: Create GitHub Release
        if: steps.release.outputs.publish == 'true'
        run: |
          notes="$(node scripts/release-notes.mjs "${{ steps.release.outputs.version }}")"
          gh release create "v${{ steps.release.outputs.version }}" \
            --title "v${{ steps.release.outputs.version }}" \
            --notes "$notes"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
