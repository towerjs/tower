name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force-publish:
        description: >-
          Publish the current main branch to npm even when the push was not a
          "release: version packages" merge. Used for the initial release or to
          retry a failed publish.
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm check:versions

      - name: Decide whether to publish
        id: release
        env:
          FORCE_PUBLISH: ${{ github.event.inputs.force-publish || 'false' }}
        run: |
          # Only publish on a "release: version packages" merge (or an explicit
          # force-publish). changesets/action would otherwise publish on every
          # push to main.
          version_merge="false"
          head_msg="$(git log -1 --pretty=%s)"
          if [ "$head_msg" = "release: version packages" ]; then
            version_merge="true"
          fi
          for parent in $(git log -1 --pretty=%P); do
            if [ "$(git log -1 "$parent" --pretty=%s)" = "release: version packages" ]; then
              version_merge="true"
            fi
          done

          if [ "$version_merge" = "true" ] || [ "$FORCE_PUBLISH" = "true" ]; then
            echo "publish=pnpm run release" >> "$GITHUB_OUTPUT"
            echo "create-releases=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=" >> "$GITHUB_OUTPUT"
            echo "create-releases=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: changesets/action@v1
        with:
          # `pnpm version` is pnpm's built-in semver command. Explicitly use
          # `pnpm run` so the repository's Changesets script is executed.
          version: pnpm run version
          # Empty when this push is not a version-packages merge, so the action
          # only opens/updates the version PR and never attempts to publish.
          publish: ${{ steps.release.outputs.publish }}
          commit: "release: version packages"
          title: "release: version packages"
          createGithubReleases: ${{ steps.release.outputs.create-releases }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
