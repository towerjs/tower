name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force-publish:
        description: >-
          Publish the current main branch to npm even when the push was not a
          "release/vX.Y.Z" merge. Used for the initial release or to retry a
          failed publish.
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm check:versions

      - name: Decide whether to publish
        id: release
        env:
          FORCE_PUBLISH: ${{ github.event.inputs.force-publish || 'false' }}
        run: |
          # Only publish on a "release/vX.Y.Z" merge (or an explicit
          # force-publish). The release PR is created by running
          # `pnpm version:patch|minor|major` on a release/vX.Y.Z branch, so the
          # merge commit message is the PR title, e.g. "release/v0.2.0 (#123)".
          publish="false"
          version=""
          head_msg="$(git log -1 --pretty=%s)"
          if [[ "$head_msg" =~ ^release/v?([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            publish="true"
            version="${BASH_REMATCH[1]}"
          fi
          if [ "$FORCE_PUBLISH" = "true" ]; then
            publish="true"
            version="$(node -e "console.log(require('./packages/towerjs/package.json').version)")"
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.release.outputs.publish == 'true'
        run: pnpm build

      - name: Publish to npm
        if: steps.release.outputs.publish == 'true'
        # Tokenless publishing via npm trusted publishing (OIDC): the workflow
        # declares id-token: write and each package has a trusted publisher for
        # this workflow file configured on npmjs.com. No NPM_TOKEN is stored.
        run: pnpm -r publish --no-git-checks

      - name: Tag and push v${{ steps.release.outputs.version }}
        if: steps.release.outputs.publish == 'true'
        run: |
          git tag "v${{ steps.release.outputs.version }}"
          git push origin "v${{ steps.release.outputs.version }}"

      - name: Create GitHub Release
        if: steps.release.outputs.publish == 'true'
        run: |
          notes="$(node scripts/release-notes.mjs "${{ steps.release.outputs.version }}")"
          gh release create "v${{ steps.release.outputs.version }}" \
            --title "v${{ steps.release.outputs.version }}" \
            --notes "$notes"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
