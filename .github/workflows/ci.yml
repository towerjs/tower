name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tower
          POSTGRES_USER: tower
          POSTGRES_PASSWORD: tower
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tower -d tower"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://tower:tower@localhost:5432/tower
      GATEHOUSE_SECRET: ci-test-secret-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:versions
      - run: pnpm build

      - run: node packages/scribe/dist/cli.js about
        working-directory: examples/with-nextjs

      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tower
          POSTGRES_USER: tower
          POSTGRES_PASSWORD: tower
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tower -d tower"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://tower:tower@localhost:5432/tower
      GATEHOUSE_SECRET: ci-test-secret-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: node packages/scribe/dist/cli.js about
        working-directory: examples/with-nextjs

      - run: pnpm --filter @towerjs/with-nextjs exec playwright install --with-deps chromium

      - run: pnpm test:e2e
